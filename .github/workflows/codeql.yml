name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (C#)
    # 비공개 저장소에서는 GitHub Advanced Security가 없으면 업로드가 실패해서, 공개된 뒤에만 실행해요.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality
      - name: Build
        run: dotnet build SafetySecurity.slnx -c Release
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:csharp"
          output: codeql-results
      - name: Summarize findings
        if: always()
        shell: pwsh
        run: |
          $sarif = Get-ChildItem codeql-results -Filter *.sarif -Recurse | Select-Object -First 1
          if (-not $sarif) { Write-Host 'No SARIF file'; exit 0 }
          $doc = Get-Content $sarif.FullName -Raw | ConvertFrom-Json
          $rows = foreach ($run in $doc.runs) {
            foreach ($r in $run.results) {
              $loc = $r.locations[0].physicalLocation
              [pscustomobject]@{
                Level = if ($r.level) { $r.level } else { 'warning' }
                Rule  = $r.ruleId
                Where = "$($loc.artifactLocation.uri):$($loc.region.startLine)"
                What  = ($r.message.text -replace '\s+', ' ')
              }
            }
          }
          $rows = @($rows | Sort-Object @{e={ @{error=0;warning=1;note=2}[$_.Level] }}, Rule, Where)
          Write-Host "CodeQL findings: $($rows.Count)"
          $rows | Group-Object Rule | Sort-Object Count -Descending | ForEach-Object { Write-Host ("{0,4}  {1}" -f $_.Count, $_.Name) }
          $rows | ForEach-Object { Write-Host "[$($_.Level)] $($_.Rule)  $($_.Where)  $($_.What)" }
          "## CodeQL findings ($($rows.Count))" >> $env:GITHUB_STEP_SUMMARY
          "| Level | Rule | Location | Message |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
          $rows | ForEach-Object { "| $($_.Level) | ``$($_.Rule)`` | ``$($_.Where)`` | $($_.What -replace '\|', '/') |" >> $env:GITHUB_STEP_SUMMARY }
