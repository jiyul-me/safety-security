name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Test
        run: dotnet test tests/SafetySecurity.Core.Tests -c Release
      - name: Publish (NativeAOT, win-x64)
        run: dotnet publish src/SafetySecurity/SafetySecurity.csproj -c Release -r win-x64 -o out -p:Version=${{ steps.ver.outputs.version }}
      - name: Integration tests
        shell: pwsh
        run: ./tests/integration/Run-Integration.ps1 -Exe out/SafetySecurity.exe
      - name: Package
        shell: pwsh
        run: |
          $name = "SafetySecurity-${{ steps.ver.outputs.version }}-win-x64"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/SafetySecurity.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "$name.zip"
          Copy-Item out/SafetySecurity.exe "SafetySecurity.exe"
          $lines = foreach ($f in @("$name.zip", "SafetySecurity.exe")) { "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          "ZIP=$name.zip" >> $env:GITHUB_ENV
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ env.ZIP }}
            SafetySecurity.exe
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "$env:ZIP" SafetySecurity.exe SHA256SUMS.txt `
            --title "SafetySecurity ${{ github.ref_name }}" --generate-notes --draft
