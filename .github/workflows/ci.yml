name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Build (Windows app is cross-built so analyzers run too)
        run: dotnet build SafetySecurity.slnx -c Release
      - name: Unit tests
        run: dotnet test tests/SafetySecurity.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

  windows:
    name: Windows build + integration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build SafetySecurity.slnx -c Release
      - name: Unit tests
        run: dotnet test tests/SafetySecurity.Core.Tests -c Release --no-build
      - name: Publish (NativeAOT, win-x64)
        run: dotnet publish src/SafetySecurity/SafetySecurity.csproj -c Release -r win-x64 -o out
      - name: Exe size
        shell: pwsh
        run: Get-Item out/SafetySecurity.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}
      - name: Integration tests
        shell: pwsh
        run: ./tests/integration/Run-Integration.ps1 -Exe out/SafetySecurity.exe
      - name: PC test script on Windows PowerShell 5.1 (non-interactive)
        shell: powershell
        run: .\tools\Test-OnMyPC.ps1 -Exe out\SafetySecurity.exe -NonInteractive
      - name: Installer (build + silent install/uninstall, both modes)
        shell: pwsh
        run: |
          # CI 빌드는 Directory.Build.props의 버전을 그대로 써요.
          $v = @(([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version)[0]
          $setup = ./.github/scripts/build-installer.ps1 -Version $v -Exe out/SafetySecurity.exe -OutDir dist-installer
          ./tests/integration/Test-Installer.ps1 -Setup $setup -Version $v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: SafetySecurity-win-x64-ci
          path: |
            out/SafetySecurity.exe
            dist-installer/*.exe
          retention-days: 7
