name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build (Windows app is cross-built for analyzers)
        run: dotnet build SafetySecurity.slnx -c Release
      - name: Unit tests
        run: dotnet test tests/SafetySecurity.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

  windows:
    name: Windows build + integration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build SafetySecurity.slnx -c Release
      - name: Unit tests
        run: dotnet test tests/SafetySecurity.Core.Tests -c Release --no-build
      - name: Publish (NativeAOT, win-x64)
        run: dotnet publish src/SafetySecurity/SafetySecurity.csproj -c Release -r win-x64 -o out
      - name: Exe size
        shell: pwsh
        run: Get-Item out/SafetySecurity.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}
      - name: Integration tests
        shell: pwsh
        run: ./tests/integration/Run-Integration.ps1 -Exe out/SafetySecurity.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SafetySecurity-win-x64-ci
          path: |
            out/SafetySecurity.exe
          retention-days: 7
