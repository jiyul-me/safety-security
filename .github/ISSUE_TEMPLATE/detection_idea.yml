name: 탐지 아이디어 / Detection idea
description: 이런 수법도 잡으면 좋겠어요.
title: "[탐지] "
labels: ["detection"]
body:
  - type: textarea
    id: technique
    attributes:
      label: 어떤 수법인가요? / Technique
      description: 레지스트리 위치, 파일 위치 등. MITRE ATT&CK ID가 있으면 적어 주세요 (예. T1546.015).
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 참고 자료 / References
      description: 분석 보고서, 블로그 링크 등
  - type: checkboxes
    id: rules
    attributes:
      label: 원칙 확인 / Design rules
      options:
        - label: 읽기 전용으로 확인할 수 있어요 (아무것도 바꾸지 않아요).
          required: true
        - label: 네트워크, 드라이버, 다른 프로세스 메모리 접근 없이 확인할 수 있어요.
          required: true
